<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Life Planner</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planner">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
/* VOICE everyday: a personal planner opened every morning and evening
   IDEA a printed planner spread: the month on the left page, today's page on the right
   PICTURE the month grid, each day carrying a tiny bar chart of its scores in tracker colours
   COLOUR white paper / night #111317, ink #15171c, indigo #3037c4 for selection, tracker hues from the validated 8-slot palette
   TYPE Fraunces 600 for page titles + Figtree for everything else
   LAYOUT 620px and up: calendar page left, day page right, each scrolling; narrower: calendar then day page; tabs at the bottom until 900px */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#111317);--page:light-dark(#f3f4f8,#0b0d10);--card:light-dark(#ffffff,#1c1f26);--panel:light-dark(#f1f2f6,#1c1f26);--panel2:light-dark(#e4e6ee,#2a2e38);
--ink:light-dark(#15171c,#eceef3);--ink2:light-dark(#5b606d,#9da3b0);--line:light-dark(#e1e3ea,#2b2f39);
--acc:light-dark(#3037c4,#9196ff);--acc-ink:light-dark(#ffffff,#0e1030);--accsoft:light-dark(#e6e7fb,#252950);--bad:light-dark(#b42318,#ff8a7a);
--c1:light-dark(#257de0,#338ced);--c2:light-dark(#f47230,#e76624);--c3:light-dark(#00b894,#00a888);--c4:light-dark(#f2a600,#d28e05);
--c5:light-dark(#ee7fac,#e24d8b);--c6:light-dark(#008a17,#0aac23);--c7:light-dark(#6a4ce2,#9887ef);--c8:light-dark(#ec4647,#eb6263)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1,h2,h3{margin:0}
.serif{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.02em}
#app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-areas:"brand tools" "banner banner" "main main" "nav nav"}
.brand{grid-area:brand;display:flex;align-items:center;gap:12px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));padding-left:max(16px,env(safe-area-inset-left));border-bottom:1px solid var(--line)}
.brand .logo{font:600 22px/1 Fraunces,Georgia,serif;letter-spacing:-.02em}
.sync{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2);white-space:nowrap;border:0;background:none;padding:6px 4px;border-radius:8px}
a.btn{text-decoration:none;color:inherit}
a.btn.pri{color:var(--acc-ink)}
.err{color:var(--bad);font-size:14px;font-weight:600;margin:0 0 10px}
.err:empty{display:none}
.how summary{cursor:pointer;font-weight:700;color:var(--acc);min-height:32px}
.how ol{margin:8px 0 0;padding-left:22px;display:grid;gap:6px;font-size:15px}
.how code{font-size:14px}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--sd,var(--ink2))}
.tools{grid-area:tools;display:flex;align-items:center;padding:4px 8px;padding-top:max(4px,env(safe-area-inset-top));padding-right:max(8px,env(safe-area-inset-right));border-bottom:1px solid var(--line)}
#banner{grid-area:banner}
#view{grid-area:main;overflow:auto;overscroll-behavior:contain}
.tabs{grid-area:nav;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);background:var(--bg)}
.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:none;color:var(--ink2);font-weight:600;font-size:13px;min-height:58px;position:relative}
.tabs button[aria-current=page]{color:var(--acc)}
@media(min-width:900px){
#app{grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:auto auto minmax(0,1fr);grid-template-areas:"brand nav tools" "banner banner banner" "main main main"}
.tabs{display:flex;justify-content:center;gap:2px;border-top:0;border-bottom:1px solid var(--line);padding:0 8px}
.tabs button{flex-direction:row;gap:8px;padding:0 11px;min-height:56px;font-size:15px;white-space:nowrap}
.tabs button[aria-current=page]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--acc)}
}
.ibtn{width:44px;height:44px;display:inline-grid;place-items:center;border:0;border-radius:12px;background:none;color:var(--ink);flex:none}
.ibtn:hover{background:var(--panel)}
.btn{height:44px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-weight:600;font-size:15px;white-space:nowrap;flex:none}
.btn:hover{background:var(--panel)}
.btn.sm{height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:transparent}
.btn.inv{background:var(--acc-ink);color:var(--acc);border-color:transparent}
.btn.ghost{background:transparent;border-color:transparent;color:inherit}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);color:#fff;border-color:transparent}
.bn{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:8px 16px;font-size:15px;line-height:1.35}
.bn span{flex:1 1 150px}
@media(max-width:600px){.bn{font-size:14px}}
.bn.ex{background:var(--panel2)}
.bn.ci{background:var(--acc);color:var(--acc-ink)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.muted{color:var(--ink2)}
.empty{padding:28px 16px;text-align:center;color:var(--ink2)}
/* calendar page */
.calview{display:block}
.calcol{padding:16px;padding-left:max(16px,env(safe-area-inset-left))}
.daycol{background:var(--page);padding:16px;padding-right:max(16px,env(safe-area-inset-right));display:grid;gap:12px;align-content:start}
@media(min-width:620px){
#view[data-view=calendar]{overflow:hidden}
.calview{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);height:100%}
.calcol,.daycol{overflow:auto;overscroll-behavior:contain}
.daycol{border-left:1px solid var(--line)}
}
.mhead{display:flex;align-items:center;gap:4px;margin-bottom:10px}
.mhead h2{flex:1;font-size:clamp(30px,5vw,44px);line-height:1.05}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border:1px solid var(--line);border-radius:99px;background:var(--bg);font-size:14px;font-weight:600;white-space:nowrap;flex:none}
.chip.on{background:var(--ink);color:var(--bg);border-color:transparent}
.wd{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;font-size:13px;font-weight:600;color:var(--ink2);text-align:center;padding:4px 0}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cell{aspect-ratio:1/1.06;min-height:46px;border:0;border-radius:10px;background:var(--panel);display:flex;flex-direction:column;padding:5px;text-align:left;position:relative;color:var(--ink)}
.cell .dn{font-size:14px;font-weight:700;line-height:20px;min-width:22px;text-align:center;border-radius:99px;align-self:flex-start}
.cell.today .dn{background:var(--ink);color:var(--bg)}
.cell.out{background:transparent;color:var(--ink2)}
.cell.out .bars{opacity:.45}
.cell.fut .dn{font-weight:500;color:var(--ink2)}
.cell.sel{outline:2.5px solid var(--acc);outline-offset:1px}
.cell .ind{position:absolute;top:7px;right:6px;display:flex;flex-direction:column;gap:3px}
.ind b{width:6px;height:6px;border-radius:50%}
.ind .nt{background:var(--ink2)}
.ind .td{border:1.5px solid var(--ink2)}
.ind .td.all{background:var(--ink2)}
.bars{margin-top:auto;display:flex;align-items:flex-end;gap:2px;height:44%}
.bars i{flex:1;height:3px;border-radius:2px;background:var(--panel2);transform-origin:bottom}
.bars i.v{border-radius:3px 3px 1px 1px}
.grid.anim .bars i.v{animation:grow .35s ease-out both}
@keyframes grow{from{transform:scaleY(0)}}
@media(prefers-reduced-motion:reduce){.grid.anim .bars i.v{animation:none}}
.msum{margin-top:18px;display:grid;gap:8px}
.msum h3{font-size:17px}
.mrow{display:grid;grid-template-columns:7.6em minmax(0,1fr) 4.6em;align-items:center;gap:10px;font-size:15px}
.mrow .nm{display:flex;align-items:center;gap:8px;font-weight:600}
.track{height:8px;border-radius:99px;background:var(--panel)}
.track b{display:block;height:100%;border-radius:99px}
.mrow .v{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink2);text-align:right}
.mfoot{font-size:14px;color:var(--ink2)}
/* day page */
.dhead{display:flex;align-items:center;gap:4px}
.daycol{container-type:inline-size}
.dhead h2{flex:1;font-size:clamp(26px,3.4vw,34px);line-height:1.08;text-wrap:balance}
.dhead .sh{display:none}
@container (max-width:440px){.dhead .lg{display:none}.dhead .sh{display:inline}}
.pill{font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--ink);color:var(--bg);white-space:nowrap}
.card{background:var(--panel);border-radius:16px;padding:14px}
.daycol .card{background:var(--card)}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ch h3{flex:1;font-size:17px}
.ch .cnt{font-size:14px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.trow{display:grid;gap:6px;padding:8px 0;border-top:1px solid var(--line)}
.trow:first-of-type{border-top:0;padding-top:0}
.tl{display:flex;align-items:center;gap:8px;min-height:24px}
.tn{flex:1;display:flex;align-items:center;gap:8px;font-weight:600}
.clr{border:0;background:none;color:var(--ink2);font-size:14px;padding:4px 6px;border-radius:8px}
.seg{display:flex;gap:4px}
.seg button{flex:1;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-weight:700;font-size:15px}
.daycol .seg button{background:var(--page)}
.seg button.on{background:var(--tc,var(--acc));color:#fff;border-color:transparent}
.seg.dk button.on{color:#0b0b0b}
.num{display:flex;align-items:center;gap:6px}
.num input{width:6.5em;height:44px;text-align:center;font-size:17px;font-weight:700}
.trow .num input[type=number]{width:5.5em;flex:none}
.num .unit{color:var(--ink2);min-width:1em}
.num .tgt{margin-left:auto;font-size:14px;color:var(--ink2);white-space:nowrap}
.todo{list-style:none;margin:0;padding:0}
.todo li{display:flex;align-items:center;gap:10px;min-height:44px;border-top:1px solid var(--line)}
.todo li:first-child{border-top:0}
.chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--ink2);background:none;display:grid;place-items:center;color:transparent;flex:none;padding:0}
.chk .ic{width:18px;height:18px;stroke-width:2.6}
.todo li.done .chk{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.todo li.done .tx{color:var(--ink2)}
.todo li.moved .tx{color:var(--ink2)}
.todo li.moved .chk{border-style:dashed;opacity:.6}
.tx{flex:1;overflow-wrap:anywhere;padding:8px 0}
.tx em{font-style:normal;font-size:13px}
.del{width:36px;height:36px;border:0;background:none;color:var(--ink2);display:grid;place-items:center;border-radius:10px;flex:none}
.del .ic{width:18px;height:18px}
.add{display:flex;gap:8px;margin-top:8px}
.add input{flex:1}
input:not([type=checkbox]):not([type=file]),select,textarea{font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);width:100%}
textarea{resize:vertical;line-height:1.5;display:block}
.carry{margin-top:8px;width:100%;justify-content:flex-start;height:auto;min-height:40px;padding:8px 12px;white-space:normal;text-align:left}
details.card>summary{list-style:none;display:flex;align-items:center;gap:8px;cursor:pointer;min-height:28px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary h3{flex:1;font-size:17px}
details.card>summary .ic{transition:transform .2s;color:var(--ink2)}
details.card[open]>summary .ic{transform:rotate(90deg)}
details.card[open]>summary{margin-bottom:8px}
.meta{font-size:13px;color:var(--ink2);margin:6px 0 0}
/* general pages */
.pg{padding:16px;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));max-width:1240px;margin:0 auto;display:grid;gap:14px;align-content:start}
.ph{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.ph h2{flex:1 1 auto;font-size:clamp(30px,5vw,44px);line-height:1.05}
.segbar{display:inline-flex;gap:2px;padding:3px;background:var(--panel);border-radius:12px;flex-wrap:wrap}
.segbar button{height:38px;padding:0 12px;border:0;border-radius:9px;background:none;font-weight:600;font-size:14px;white-space:nowrap}
.segbar button.on{background:var(--bg);box-shadow:0 1px 2px rgb(0 0 0/.12)}
.pnav{display:flex;align-items:center;gap:2px}
.pnav b{min-width:7.5em;text-align:center;white-space:nowrap}
/* lists */
.lview{display:grid;gap:14px}
@media(min-width:760px){.lview{grid-template-columns:230px minmax(0,1fr);align-items:start}}
.lnav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
@media(min-width:760px){.lnav{flex-direction:column;overflow:visible;position:sticky;top:0}}
.lnav button{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:0;border-radius:12px;background:var(--panel);font-weight:600;white-space:nowrap;flex:none;text-align:left}
.lnav button .n{margin-left:auto;padding-left:8px;color:var(--ink2);font-weight:500;font-variant-numeric:tabular-nums}
.lnav button.on{background:var(--ink);color:var(--bg)}
.lnav button.on .n{color:inherit;opacity:.7}
.lnav button.newl{background:none;border:1px dashed var(--line);color:var(--ink2)}
.lhead{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.lhead h2{flex:1 1 auto;font-size:clamp(28px,4vw,40px);line-height:1.05}
.lctl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.lctl select{width:auto}
.items{display:grid;gap:8px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:baseline;padding:12px 14px;border:0;border-radius:14px;background:var(--panel);text-align:left;width:100%}
.item .t{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.item .s{grid-column:1;color:var(--ink2);font-size:14px;overflow-wrap:anywhere}
.item .r{grid-column:2;grid-row:1;text-align:right;white-space:nowrap}
.item .st{grid-column:2;grid-row:2;font-size:13px;font-weight:600;color:var(--ink2);text-align:right;white-space:nowrap}
.item .st.done{color:var(--ink)}
.stars{letter-spacing:1px;color:var(--ink);font-size:14px}
.stars .off{color:var(--panel2)}
.big-todo{max-width:720px}
/* stats */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:760px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--panel);border-radius:16px;padding:14px}
.tile .l{font-size:14px;color:var(--ink2);font-weight:600}
.tile .v{font-size:clamp(26px,4vw,34px);font-weight:800;line-height:1.15}
.tile .s{font-size:13px;color:var(--ink2)}
.two{display:grid;gap:14px}
@media(min-width:760px){.two{grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);align-items:start}}
.tlist{display:grid;gap:2px}
.trk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 10px;padding:10px 12px;border:0;border-radius:12px;background:none;text-align:left;width:100%}
.trk.on{background:var(--bg);box-shadow:0 0 0 2px var(--acc) inset}
.trk .nm{display:flex;align-items:center;gap:8px;font-weight:700}
.trk .mv{font-weight:800;font-size:18px;text-align:right;white-space:nowrap}
.trk .sb{font-size:13px;color:var(--ink2)}
.trk .sk{font-size:13px;color:var(--ink2);text-align:right;white-space:nowrap}
.finding{font-size:17px;font-weight:700;line-height:1.3;margin:0 0 12px;text-wrap:balance}
.cols{position:relative;display:flex;align-items:flex-end;gap:2px;height:190px;border-bottom:1px solid var(--ink2);padding-top:18px}
.cols .col{flex:1;height:100%;display:flex;align-items:flex-end}
.cols .col i{display:block;width:100%;border-radius:4px 4px 0 0}
.cols .col:hover i{filter:brightness(1.12)}
.cols .ymax{position:absolute;top:0;left:0;font-size:13px;color:var(--ink2)}
.cols .grd{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.xl{display:flex;gap:2px;font-size:13px;color:var(--ink2);margin-top:4px}
.xl span{flex:1;text-align:center;white-space:nowrap;overflow:visible}
.hmw{overflow-x:auto;padding-bottom:4px}
.hm{display:grid;grid-template-rows:16px repeat(7,12px);grid-auto-flow:column;grid-auto-columns:12px;gap:3px;width:max-content}
.hm i{border-radius:3px;background:var(--panel2)}
.hm i.no{background:transparent}
.hm .mlab{font-size:13px;color:var(--ink2);line-height:16px;white-space:nowrap;grid-row:1}
.legend{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--ink2);margin-top:8px}
.legend i{width:12px;height:12px;border-radius:3px}
/* goals */
.goals{display:grid;gap:12px}
@media(min-width:760px){.goals{grid-template-columns:repeat(2,minmax(0,1fr))}}
.goal h3{font-size:18px;flex:1;overflow-wrap:anywhere}
.gnum{font-size:15px;color:var(--ink2);margin-bottom:6px}
.gnum b{font-size:30px;font-weight:800;color:var(--ink);margin-right:4px}
.pbar{position:relative;height:12px;border-radius:99px;background:var(--panel2)}
.pbar>b{display:block;height:100%;border-radius:99px;background:var(--acc)}
.pbar .pace{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:2px}
.gpace{font-size:14px;font-weight:600;margin:6px 0 0}
.mdots{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px;margin-top:12px}
.mdots button{height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:13px;font-weight:700;padding:0}
.mdots button.has{color:#fff;border-color:transparent}
.mdots button.due{border:2px solid var(--acc);color:var(--acc)}
.mdots button:disabled{opacity:.35;cursor:default}
.gkey{font-size:13px;color:var(--ink2)}
/* wrapped */
.deckw{position:relative}
.deck{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:none}
.wcard{flex:0 0 100%;scroll-snap-align:start;min-height:440px;border-radius:22px;padding:22px;background:var(--wc);color:#fff;display:flex;flex-direction:column;gap:10px}
@media(min-width:760px){.wcard{flex-basis:calc(50% - 6px)}}
@media(min-width:1100px){.wcard{flex-basis:calc(33.333% - 8px)}}
.wcard h3{font:600 28px/1.1 Fraunces,Georgia,serif;letter-spacing:-.02em;text-wrap:balance}
.wcard .big{font-size:clamp(64px,16vw,96px);font-weight:800;line-height:.95;margin:6px 0 0;letter-spacing:-.03em}
.wcard .lead{font-size:18px;font-weight:600;margin:0}
.wcard p{margin:0}
.wcard .foot{margin-top:auto;font-size:15px;opacity:.85}
.wrows{display:grid;gap:10px;margin-top:4px}

eachDay(from,to,k=>{const v=val(dayGet(k),t);if(v==null)return;n++;if(t.type==='check'){if(v)yes++}else sum+=v});

function goalUnit(g,n){const one=n===1;if(g.kind==='list'){return (S.lists[g.listId]?.name||'items').toLowerCase()}if(g.kind==='tracker')return one?'day':'days';return g.unit||''}

const cands=[];if(d.getDate()>dim(d.getFullYear(),d.getMonth()+1)-3)cands.push(cur);cands.push(prev);

function docData(path){const [c,id]=path.split('/');if(c==='meta')return id==='config'?S.config:id==='work'?S.work:S.todos;if(c==='lists')return S.lists[id]||null;if(c==='months')return S.months[id]||null;return null}
function setDoc(path,v){const [c,id]=path.split('/');if(c==='meta'){if(id==='config')S.config=v;else if(id==='work')S.work=v;else S.todos=v}else if(c==='lists')S.lists[id]=v;else if(c==='months')S.months[id]=v}
function removeDoc(path){const [c,id]=path.split('/');if(c==='lists')delete S.lists[id];else if(c==='months')delete S.months[id]}

const emptyState=()=>({config:{trackers:[],habits:[],goals:[],listOrder:[]},todos:{items:[]},work:{items:[]},lists:{},months:{}});

/* merging: days by their u stamp, list and to-do items by id and u, deletions kept as tombstones */
function mergeDoc(path,a,b){
if(path==='meta/config')return (a.u||0)>=(b.u||0)?a:b;

const del={...(b.del||{})};for(const [id,t] of Object.entries(a.del||{}))del[id]=Math.max(del[id]||0,t);
const byId=new Map();for(const it of b.items||[])byId.set(it.id,it);
for(const it of a.items||[]){const o=byId.get(it.id);if(!o||(it.u||0)>=(o.u||0))byId.set(it.id,it)}

/* ---------- GitHub sync ---------- */
const FILE=p=>p.startsWith('meta/')?p.slice(5)+'.json':p+'.json';
function PATH(f){if(f==='config.json')return 'meta/config';if(f==='todos.json')return 'meta/todos';if(f==='work.json')return 'meta/work';const m=/^(lists|months)\/([A-Za-z0-9_.~-]+)\.json$/.exec(f);return m?m[1]+'/'+m[2]:null}

function GhErr(status,text){const e=new Error(text||('GitHub '+status));e.status=status;return e}
async function gh(path,opt={},c=cfg){let res;

async function ghFail(r){let m='';try{m=(await r.json()).message||''}catch(e){}return GhErr(r.status,m)}
function commitMsg(p){if(p==='meta/config')return 'Update settings and goals';if(p==='meta/todos')return 'Update general to-do';if(p==='meta/work')return 'Update work to-do';if(p.startsWith('months/')){const mk=p.slice(7);return `Update ${MON[+mk.slice(5)-1]} ${mk.slice(0,4)}`}const l=S.lists[p.slice(6)];return 'Update '+(l?l.name:'list')}
let pulling=null;
function pull(){if(!pulling)pulling=doPull().finally(()=>{pulling=null});return pulling}
async function doPull(){
const r=await gh(`git/trees/${encodeURIComponent(cfg.branch||'main')}?recursive=1`);
if(r.status===409||r.status===404)return {empty:true,changed:false};
if(!r.ok)throw await ghFail(r);
const j=await r.json(),files={};
for(const t of j.tree||[])if(t.type==='blob'&&PATH(t.path))files[t.path]=t.sha;
if(!('config.json' in files)&&meta.shas['config.json']&&hasPlanner(S)){
/* the repo was emptied or replaced: keep this device's copy and upload it again */
meta.shas={};for(const p of allPaths(S)){dirty.add(p);seq[p]=(seq[p]||0)+1}saveMeta();return {empty:false,changed:false}}
let changed=false;
for(const [f,sha] of Object.entries(files)){
if(meta.shas[f]===sha)continue;
const b=await gh('git/blobs/'+sha);if(!b.ok)throw await ghFail(b);
let remote=null;try{remote=JSON.parse(b64d((await b.json()).content))}catch(e){}
if(remote&&typeof remote==='object'){const p=PATH(f);mergeInto(p,remote,dirty.has(p));changed=true}
meta.shas[f]=sha}
for(const f of Object.keys(meta.shas))if(!(f in files)){const p=PATH(f);delete meta.shas[f];if(p&&!dirty.has(p)){removeDoc(p);changed=true}}
meta.last=Date.now();saveMeta();
if(changed){S=normalize(S);saveLocalNow();widgetSync()}
return {empty:!('config.json' in files),changed}}
let pushT=null,pushing=false,pushAgain=false,fails=0;
function schedulePush(ms=2500){clearTimeout(pushT);pushT=setTimeout(pushAll,ms);if(!['saving','auth','noaccess','offline'].includes(syncState))setSync('pending')}
async function pushAll(){clearTimeout(pushT);pushT=null;
if(mode!=='github')return;
if(pushing){pushAgain=true;return}
if(!dirty.size){if(syncState==='pending')setSync('saved');return}
pushing=true;setSync('saving');
try{for(const p of [...dirty]){const s0=seq[p]||0;await pushOne(p);if((seq[p]||0)===s0)dirty.delete(p);else pushAgain=true;saveMeta()}
fails=0;meta.last=Date.now();saveMeta();setSync(dirty.size?'pending':'saved');renderBanner()}
catch(e){syncFailed(e)}
finally{pushing=false;if(pushAgain){pushAgain=false;if(dirty.size&&mode==='github')schedulePush(800)}}}
async function pushOne(p){const f=FILE(p);
for(let i=0;i<4;i++){const data=docData(p),sha=meta.shas[f];let r;
if(data==null){if(!sha)return;r=await gh('contents/'+f,{method:'DELETE',body:{message:'Remove '+f,sha}});if(r.ok||r.status===404){delete meta.shas[f];return}}
else{const body={message:commitMsg(p),content:b64e(JSON.stringify(data,null,1))};if(sha)body.sha=sha;r=await gh('contents/'+f,{method:'PUT',body});if(r.ok){meta.shas[f]=(await r.json()).content.sha;return}}
if(r.status===409||r.status===422){await refetch(f);continue}
throw await ghFail(r)}

async function refetch(f){const r=await gh('contents/'+f+'?ref='+encodeURIComponent(cfg.branch||'main'));
if(r.status===404){delete meta.shas[f];return}
if(!r.ok)throw await ghFail(r);
const j=await r.json();let remote=null;try{remote=JSON.parse(b64d(j.content))}catch(e){}
meta.shas[f]=j.sha;const p=PATH(f);if(remote&&typeof remote==='object'&&p){mergeInto(p,remote,true);S=normalize(S);saveLocalNow()}}
function syncFailed(e){const st=e?.status;
if(st===401){setSync('auth');renderBanner();return}
if(st===403&&/not accessible|permission/i.test(e.message||'')){setSync('noaccess');renderBanner();return}
setSync(st===0?'offline':'error');
if(++fails<8){clearTimeout(pushT);pushT=setTimeout(pushAll,Math.min(120000,3000*2**fails))}}
async function syncNow(){if(mode!=='github')return;
try{if(!['auth','noaccess'].includes(syncState))setSync('saving');const res=await pull();
if(res.empty&&!hasPlanner(S)){S=blankState();for(const p of allPaths(S)){dirty.add(p);seq[p]=(seq[p]||0)+1}saveMeta();saveLocalNow();widgetSync()}
if(res.changed||res.empty)softRender();
await pushAll();if(!dirty.size){fails=0;setSync('saved')}renderBanner();if(!syncNow.done&&hasPlanner(S)&&meta.last){syncNow.done=true;pruneDone();saveMigrated();maybeWrapPopup()}if(meta.last)rolloverCheck()}
catch(e){syncFailed(e);if(!meta.last)render()}}
function parseRepo(s){const m=/^(?:https?:\/\/)?(?:www\.)?(?:github\.com\/)?([A-Za-z0-9-]+)\/([A-Za-z0-9._-]+?)(?:\.git)?\/?$/.exec(String(s||'').trim());return m?`${m[1]}/${m[2]}`:null}
const TOKEN_RW='That token can read the repo but can’t save to it. Edit the token on GitHub and set Contents to Read and write.';
async function connectRepo(repoIn,tokenIn){
const repo=parseRepo(repoIn),token=String(tokenIn||'').trim();
if(!repo)throw 'Enter the repo as owner/name, for example matt2868/life-planner-data.';

const c={mode:'github',repo,token};
let r;try{r=await gh('',{},c)}catch(e){throw 'Couldn’t reach GitHub. Check your connection and try again.'}
if(r.status===401)throw 'GitHub didn’t accept that token. Check it was copied in full.';

if(!r.ok)throw `GitHub replied with an error (${r.status}). Try again in a minute.`;
const j=await r.json();c.branch=j.default_branch||'main';
if(mode==='github'&&cfg.repo===repo){cfg=c;saveCfg();setSync('saving');await syncNow();if(syncState==='noaccess')throw TOKEN_RW;if(syncState==='auth')throw 'GitHub didn’t accept that token.';return 'token'}

if(dirty.size){if(syncState==='noaccess')throw TOKEN_RW;throw 'Connected, but saving to the repo failed. Check your connection, then tap Sync now in settings.'}

S=normalize(S);if(prev)store.set(K.backup,prev);saveLocalNow();setSync('saved');return 'loaded'}
function setSync(s){syncState=s;const el=$('#sync');if(!el)return;

const RMO=matchMedia('(prefers-reduced-motion: reduce)'),ticking=new Map();

function tickFx(btn,on,leaves,commit){const li=btn.closest('li'),id=li&&li.dataset.id;
if(!li||!id||RMO.matches){commit();return}
if(ticking.has(id))return;
if(on)haptic();
if(!on&&!leaves){commit();return}
let fired=false;const fin=()=>{if(fired)return;fired=true;ticking.delete(id);commit();if(leaves)landed(id)};
if(on){ticking.set(id,true);li.classList.add('ticking','done','ticked');btn.setAttribute('aria-pressed','true')}else li.classList.add('unticking');

/* ---------- habits ---------- */
const habitsActive=()=>S.config.habits.filter(h=>!h.archived);

const PER={day:['day','days','today','a day'],week:['week','weeks','this week','a week'],month:['month','months','this month','a month']};
const perOf=h=>PER[h.per]||PER.week;

function hStart(h,log){let s=h.created||TODAY();for(const k of Object.keys(log))if(k<s)s=k;return s}
/* periods (days, weeks or months) overlapping from..to, between the habit's start and today */
function hPeriods(h,log,from,to){const t=TODAY(),st=hStart(h,log),out=[];const a=from<st?st:from,b=to>t?t:to;if(a>b)return out;
for(let k=pStart(h.per,a);k<=b;k=pNext(h.per,k)){const e=pEnd(h.per,k);let n=0;for(let x=k;x<=e;x=addDays(x,1))n+=log[x]||0;out.push({k,n,ok:n>=(h.n||1),cur:k<=t&&t<=e})}
return out}
function hStats(h,from,to){const log=hLog(h),t=TODAY(),all=hPeriods(h,log,'0000-01-01',t);
const last=all[all.length-1],cur=last&&last.cur?last:{n:0};
let streak=0;for(let i=all.length-1;i>=0;i--){const p=all[i];if(p.ok)streak++;else if(p.cur)continue;else break}

function cSeries(items,from,to,l){const per={};items.forEach(i=>{for(const [k,v] of Object.entries(i.c||{})){if(k<from||k>to)continue;const p=per[k]||(per[k]=[0,0]);p[0]+=+v[0]||0;p[1]+=+v[1]||0}});

/* ---------- drag to reorder (press and hold, or drag a handle) ---------- */
let dragJust=0;
const sib=(el,d)=>{let s=d<0?el.previousElementSibling:el.nextElementSibling;while(s&&!(s.dataset&&s.dataset.id))s=d<0?s.previousElementSibling:s.nextElementSibling;return s};
function sortable(list,onDone){if(!list||list._sortable)return;list._sortable=1;
let timer=0,row=null,sx=0,sy=0,pid=null,on=false;
const horiz=()=>{const cs=getComputedStyle(list);return cs.display.includes('flex')&&cs.flexDirection.startsWith('row')};
const begin=()=>{timer=0;if(!row)return;on=true;row.classList.add('drag');list.classList.add('sorting');try{list.setPointerCapture(pid)}catch(e){}try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}};
list.addEventListener('pointerdown',e=>{if(e.button>0||e.target.closest('.cctl'))return;let r=e.target;while(r&&r.parentElement!==list)r=r.parentElement;if(!r||!r.dataset||!r.dataset.id)return;row=r;sx=e.clientX;sy=e.clientY;pid=e.pointerId;
if(e.target.closest('.grip')){e.preventDefault();begin();return}clearTimeout(timer);timer=setTimeout(begin,420)});
list.addEventListener('pointermove',e=>{if(!on){if(timer&&Math.hypot(e.clientX-sx,e.clientY-sy)>8){clearTimeout(timer);timer=0;row=null}return}
const h=horiz(),p=h?e.clientX:e.clientY,prev=sib(row,-1),next=sib(row,1);
if(prev){const b=prev.getBoundingClientRect();if(p<(h?b.left+b.width/2:b.top+b.height/2)){list.insertBefore(row,prev);list.dispatchEvent(new Event('sortmove'));return}}
if(next){const b=next.getBoundingClientRect();if(p>(h?b.left+b.width/2:b.top+b.height/2)){list.insertBefore(next,row);list.dispatchEvent(new Event('sortmove'))}}});
const finish=()=>{clearTimeout(timer);timer=0;if(!on){row=null;return}on=false;row.classList.remove('drag');list.classList.remove('sorting');row=null;dragJust=Date.now();
onDone([...list.children].filter(c=>c.dataset&&c.dataset.id).map(c=>c.dataset.id))};
list.addEventListener('pointerup',finish);list.addEventListener('pointercancel',finish);
list.addEventListener('touchmove',e=>{if(on&&e.cancelable)e.preventDefault()},{passive:false});

function reorderSubset(arr,ids){const set=new Set(ids),slots=[];arr.forEach((x,i)=>{if(set.has(x.id))slots.push(i)});if(slots.length!==ids.length)return null;
const map=new Map(arr.map(x=>[x.id,x])),next=arr.slice();ids.forEach((id,k)=>{next[slots[k]]=map.get(id)});return next.map(x=>x.id).join()===arr.map(x=>x.id).join()?null:next}
function reorderIds(order,ids){const next=reorderSubset(order.map(id=>({id})),ids);return next?next.map(x=>x.id):order}

else if(ui.sp==='year'){from=`${ui.syear}-01-01`;to=`${ui.syear}-12-31`;label=String(ui.syear)}
else{from=earliest()||t;to=t;label='All time'}

function viewStats(v){const ts=trks();if(!ui.strk||!ts.some(t=>t.id===ui.strk))ui.strk=ts[0]?.id||null;
const {from,to,label}=statsRange(),today=TODAY();const none=from>today;
let logged=0,days=0,tdDone=0,tdAll=0,notes=0,words=0,scS=0,scN=0;
if(!none)eachDay(from,to,k=>{days++;const d=dayGet(k);if(hasEntry(d))logged++;if(d){const r=d.t.filter(x=>!x.m);tdAll+=r.length;tdDone+=r.filter(x=>x.d).length;const tx=(d.n||'').trim();if(tx){notes++;words+=tx.split(/\s+/).length}}const sc=dayScore(d);if(sc!=null){scS+=sc;scN++}});
const logRun=curRun(hasEntry);
const cm=today.slice(0,7),pmk=addMonths(cm,-1),cy=+cm.slice(0,4);
const wrapCard=`<div class="card"><div class="ch"><h3>Wrapped</h3></div><div class="row"><button class="btn" data-a="wopen" data-k="month" data-v="${cm}">${MON[+cm.slice(5)-1]} so far</button><button class="btn" data-a="wopen" data-k="month" data-v="${pmk}">${MON[+pmk.slice(5)-1]}</button><button class="btn" data-a="wopen" data-k="year" data-v="${cy}">${cy} so far</button><button class="btn" data-a="wopen" data-k="year" data-v="${cy-1}">${cy-1}</button></div></div>`;
const hs=habitsActive();
const habCard=hs.length&&!none?`<div class="card"><div class="ch"><h3>Habits</h3><span class="cnt">${esc(label)}</span></div><table class="htab"><thead><tr><th>Habit</th><th>Done</th><th>Target hit</th><th>Streak now</th></tr></thead><tbody>${hs.map(h=>{const s=hStats(h,from,to),p=perOf(h);return `<tr><td data-l=""><i class="dot" style="background:var(--c${h.c})"></i> ${esc(h.name)}</td><td data-l="Done">${plural(s.times,'time')}</td><td data-l="Target hit">${s.total?`${s.met} of ${plural(s.total,p[0])}`:'–'}</td><td data-l="Streak now">${plural(s.streak,p[0])}</td></tr>`}).join('')}</tbody></table></div>`:'';
const head=`<div class="ph"><h2 class="serif">Stats</h2><div class="segbar" role="group" aria-label="Period">${[['month','Month'],['year','Year'],['all','All time']].map(([k,lb])=>`<button class="${ui.sp===k?'on':''}" data-a="sp" data-p="${k}">${lb}</button>`).join('')}</div>${ui.sp!=='all'?`<div class="pnav"><button class="ibtn" data-a="sprev" aria-label="Earlier">${ICON.l}</button><b>${esc(label)}</b><button class="ibtn" data-a="snext" aria-label="Later">${ICON.r}</button></div>`:''}</div>`;
if(none){v.innerHTML=`<div class="pg">${head}<p class="empty">Nothing logged.</p>${wrapCard}</div>`;return}
const tiles=`<div class="tiles"><div class="tile"><div class="l">Days logged</div><div class="v">${logged}</div><div class="s">of ${plural(days,'day')}${logRun>1?` · ${logRun} in a row now`:''}</div></div><div class="tile"><div class="l">Average day score</div><div class="v">${scN?Math.round(scS/scN*100)+'%':'–'}</div><div class="s">across all trackers</div></div><div class="tile"><div class="l">To-dos done</div><div class="v">${tdDone}</div><div class="s">${tdAll?`${Math.round(tdDone/tdAll*100)}% of ${tdAll} planned`:'none planned'}</div></div><div class="tile"><div class="l">Notes written</div><div class="v">${notes}</div><div class="s">${plural(words,'word')}</div></div></div>`;
if(!ts.length){v.innerHTML=`<div class="pg">${head}${tiles}${habCard}${wrapCard}</div>`;return}
const tlist=ts.map(t=>{const s=trackerStats(t,from,to),br=bestRun(t,from,to);return `<button class="trk${t.id===ui.strk?' on':''}" data-a="strk" data-id="${esc(t.id)}" aria-pressed="${t.id===ui.strk}"><span class="nm"><i class="dot" style="background:var(--c${t.c})"></i>${esc(t.name)}</span><span class="mv">${esc(s.main)}</span><span class="sb">${esc(s.sub)}</span><span class="sk">best run ${plural(br,'day')}</span></button>`}).join('');
const t=trk(ui.strk),col=`var(--c${t.c})`;
const cs=trackerStats(t,from,to);
let pts=[],xl=[],ymax=1,ylab='',grid=null,finding='';
const yv=v2=>t.type==='check'?(v2?1:0.06):v2;
if(t.type==='scale'){ymax=t.max;ylab=String(t.max);grid=0.6}
else if(t.type==='number'){let mx=t.target||0;eachDay(from,to,k=>{const x=val(dayGet(k),t);if(x!=null&&x>mx)mx=x});ymax=Math.max(1,Math.ceil(mx));ylab=`${ymax}${t.unit?' '+t.unit:''}`;if(t.target)grid=t.target/ymax}
else{ylab='100%'}
if(ui.sp==='month'){const n=dim(+ui.smonth.slice(0,4),+ui.smonth.slice(5));for(let i=1;i<=n;i++){const k=`${ui.smonth}-${p2(i)}`;const x=k>today?null:val(dayGet(k),t);pts.push({v:x==null?null:yv(x),tip:`${fmtShort(k)}: ${k>today?'still to come':fmtVal(t,x)}`});xl.push([1,8,15,22,29].includes(i)?String(i):'')}
const pm=addMonths(ui.smonth,-1),ps=trackerStats(t,`${pm}-01`,`${pm}-${p2(dim(+pm.slice(0,4),+pm.slice(5)))}`);
finding=findingText(t,cs,ps,MON[+ui.smonth.slice(5)-1],MON[+pm.slice(5)-1])}
else{const months=[];if(ui.sp==='year')for(let i=1;i<=12;i++)months.push(`${ui.syear}-${p2(i)}`);else{for(let mk=from.slice(0,7);mk<=today.slice(0,7);mk=addMonths(mk,1))months.push(mk)}
months.forEach((mk,i)=>{const a=`${mk}-01`,b0=`${mk}-${p2(dim(+mk.slice(0,4),+mk.slice(5)))}`,b=b0>today?today:b0;const s=a>today?{n:0}:trackerStats(t,a,b);
pts.push({v:s.n?(t.type==='check'?s.avg:s.avg):null,tip:`${MON3[+mk.slice(5)-1]} ${mk.slice(0,4)}: ${s.n?`${s.main}${t.type==='check'?' of days':' average'} (${plural(s.n,'day')})`:'nothing logged'}`});
xl.push(ui.sp==='year'?MON[+mk.slice(5)-1][0]:(months.length<=12||i%3===0?MON3[+mk.slice(5)-1]:''))});
if(ui.sp==='year'){const ps=trackerStats(t,`${ui.syear-1}-01-01`,`${ui.syear-1}-12-31`);finding=findingText(t,cs,ps,String(ui.syear),String(ui.syear-1))}
else finding=cs.n?`${t.name}: ${cs.main}${t.type==='check'?' of logged days':' on average'} since ${fmtDay(from)} ${from.slice(0,4)}`:`No ${t.name.toLowerCase()} logged yet`}
const chart=`<div class="card"><p class="finding">${esc(finding)}</p>${colsChart(pts,col,ymax,ylab,xl,grid)}</div>`;
const hy=ui.sp==='year'?ui.syear:ui.sp==='month'?+ui.smonth.slice(0,4):+today.slice(0,4);
const wd=Array.from({length:7},()=>({s:0,n:0}));eachDay(from,to,k=>{const x=norm(t,val(dayGet(k),t));if(x!=null){const w=wdMon(k);wd[w].s+=x;wd[w].n++}});
const wdRows=wd.map((x,i)=>{const a=x.n?x.s/x.n:null;let lb='–';if(a!=null){lb=t.type==='check'?`${Math.round(a*100)}%`:t.type==='scale'?fmtNum(a*t.max):`${fmtNum(a*(t.target||1))}${t.unit?' '+t.unit:''}`}return `<div class="mrow"><span class="nm">${WD3[i]}</span><span class="track"><b style="width:${a==null?0:Math.round(a*100)}%;background:${col}"></b></span><span class="v">${esc(lb)}</span></div>`}).join('');
let bw=-1,bv=-1;wd.forEach((x,i)=>{if(x.n&&x.s/x.n>bv){bv=x.s/x.n;bw=i}});
v.innerHTML=`<div class="pg">${head}${tiles}<div class="two"><div class="card"><div class="ch"><h3>Trackers</h3><span class="cnt">${esc(label)}</span></div><div class="tlist">${tlist}</div></div>${chart}</div>
<div class="card"><div class="ch"><h3>${esc(t.name)} through ${hy}</h3></div>${heatmap(t,hy)}</div>
<div class="card"><div class="ch"><h3>${bw>=0?`${esc(t.name)} is best on ${WDP[bw]}`:'By day of the week'}</h3><span class="cnt">${esc(label)}</span></div><div class="msum" style="margin-top:0">${wdRows}</div></div>${habCard}${wrapCard}</div>`}
function findingText(t,cs,ps,now,prev){if(!cs.n)return `No ${t.name.toLowerCase()} logged in ${now} yet`;
const base=t.type==='check'?`${t.name} on ${cs.main} of logged days in ${now}`:`${t.name} averaged ${cs.main} in ${now}`;
if(!ps.n)return base;const diff=cs.avg-ps.avg;const tol=t.type==='check'?0.03:t.type==='scale'?0.1:0.1*(t.target||1);
if(Math.abs(diff)<tol)return `${base}, about the same as ${prev}`;
return `${base}, ${diff>0?'up':'down'} from ${ps.main} in ${prev}`}
function heatGrid(y,col,cell,leg){const start=`${y}-01-01`,lead=wdMon(start),n=(y%4===0&&y%100!==0)||y%400===0?366:365,today=TODAY();
let cells='',labs='';const cols=Math.ceil((lead+n)/7);
for(let m=0;m<12;m++){const idx=Math.round((new Date(y,m,1)-new Date(y,0,1))/864e5);labs+=`<span class="mlab" style="grid-column:${Math.floor((lead+idx)/7)+1}/span 4">${MON3[m]}</span>`}
for(let c=0;c<cols;c++)for(let r=0;r<7;r++){const i=c*7+r-lead,pos=`grid-row:${r+2};grid-column:${c+1}`;
if(i<0||i>=n){cells+=`<i class="no" style="${pos}"></i>`;continue}
const k=addDays(start,i);if(k>today){cells+=`<i class="no" style="${pos};outline:1px solid var(--line);outline-offset:-1px"></i>`;continue}
const {x,tip}=cell(k);cells+=`<i style="${pos}${x!=null?`;background:color-mix(in srgb,${col} ${Math.round(18+82*x)}%,var(--panel2))`:''}" data-tip="${esc(tip)}"></i>`}
const L=leg||['Not logged','Low','High'];const steps=(L[1]?[0,.25,.5,.75,1]:[1]).map(x=>`<i style="background:color-mix(in srgb,${col} ${Math.round(18+82*x)}%,var(--panel2))"></i>`).join('');
return `<div class="hmw"><div class="hm">${labs}${cells}</div></div><div class="legend"><span>${L[0]}</span><i style="background:var(--panel2)"></i>${L[1]?`<span style="margin-left:10px">${L[1]}</span>`:''}${steps}<span>${L[2]}</span></div>`}
function heatmap(t,y){return heatGrid(y,`var(--c${t.c})`,k=>{const v=val(dayGet(k),t);return {x:norm(t,v),tip:`${fmtShort(k)}: ${fmtVal(t,v)}`}})}

const due=dueCheckins();

const WC=['#2a2fb8','#0c6a57','#a3224d','#1c1e25','#0b57a8','#9a3a0c','#4d2bb0','#1c1e25'];
function wrapRange(){const t=TODAY();let from,to,label,title;
if(ui.wk==='month'){const [y,m]=ui.wmonth.split('-').map(Number);from=`${ui.wmonth}-01`;to=`${ui.wmonth}-${p2(dim(y,m))}`;label=`${MON[m-1]} ${y}`;title=MON[m-1]}
else{from=`${ui.wyear}-01-01`;to=`${ui.wyear}-12-31`;label=String(ui.wyear);title=String(ui.wyear)}
const partial=to>t;if(to>t)to=t;return {from,to,label,title,partial}}
function wrapData(from,to){const ts=trks();const W={days:0,logged:0,words:0,notes:0,td:0,tdAll:0,best:null,bestSc:-1,logRun:0,logBest:0,wd:Array.from({length:7},()=>({s:0,n:0})),busy:null,busyN:0,cells:[],bestNote:''};
const runs={},br={};ts.forEach(t=>{runs[t.id]=0;br[t.id]=0});
eachDay(from,to,k=>{W.days++;const d=dayGet(k),sc=dayScore(d);W.cells.push({k,sc});
if(hasEntry(d)){W.logged++;W.logRun++;W.logBest=Math.max(W.logBest,W.logRun)}else W.logRun=0;
if(d){const tx=(d.n||'').trim();if(tx){W.notes++;W.words+=tx.split(/\s+/).length}const r=d.t.filter(x=>!x.m),dn=r.filter(x=>x.d).length;W.tdAll+=r.length;W.td+=dn;if(dn>W.busyN){W.busyN=dn;W.busy=k}}
if(sc!=null){if(sc>W.bestSc||(sc===W.bestSc&&(d.n||'').trim()&&!W.bestNote)){W.bestSc=sc;W.best=k;W.bestNote=(d.n||'').trim()}const w=wdMon(k);W.wd[w].s+=sc;W.wd[w].n++}
ts.forEach(t=>{if(good(t,val(d,t))){runs[t.id]++;br[t.id]=Math.max(br[t.id],runs[t.id])}else runs[t.id]=0})});
W.hab=habitsActive().map(h=>({h,st:hStats(h,from,to)}));W.trk=ts.map(t=>({t,st:trackerStats(t,from,to),run:br[t.id]}));
W.lists=listOrder().map(id=>S.lists[id]).filter(l=>lType(l)!=='ordered').map(l=>{const dn=l.items.filter(i=>i.done&&i.d&&i.d>=from&&i.d<=to);return {l,n:dn.length,top:l.rate?[...dn].sort((a,b)=>(b.r||0)-(a.r||0))[0]:null}});
let bw=-1,bv=-1;W.wd.forEach((x,i)=>{if(x.n&&x.s/x.n>bv){bv=x.s/x.n;bw=i}});W.bestWd=bw;W.bestWdV=bv;return W}
function viewWrapped(v){const {from,to,label,title,partial}=wrapRange(),today=TODAY();

if(W.tdAll)cards.push(card(`<h3>To-dos ticked off</h3><p class="big">${W.td}</p><p class="lead">${Math.round(W.td/W.tdAll*100)}% of the ${W.tdAll} you planned</p>${W.busy?`<p class="foot">Busiest day: ${WDL[parseK(W.busy).getDay()]} ${fmtDay(W.busy)}, with ${W.busyN} done</p>`:''}`));
const fin=W.lists.filter(x=>x.n);
if(fin.length){const top=fin.sort((a,b)=>b.n-a.n);cards.push(card(`<h3>Lists</h3><div class="wrows">${top.map(x=>`<div class="wrow"><span><b style="font-size:28px">${x.n}</b> ${esc(lType(x.l)==='archive'?x.l.states.done.toLowerCase():'ticked off')}, ${esc(x.l.name)}</span><span class="wv"></span>${x.top&&x.top.r?`<small>Top: ${esc(x.top.t)}, ${x.top.r} of ${x.l.rate}</small>`:''}</div>`).join('')}</div>`))}

td:f=>{const inp=$('#td-new',f),x=inp.value.trim();if(!x)return;const k=f.dataset.k||ui.sel,d=dayEnsure(k);d.t.push({id:uid(),x,d:false});dayDone(k);refreshDay();$('#td-new')?.focus()},

D.addEventListener('focusout',e=>{const i=e.target;if(!(i instanceof HTMLInputElement)||!i.matches('form.add[data-key] input'))return;const f=i.closest('form');setTimeout(()=>{if(!f.isConnected||f.contains(D.activeElement)||i.value.trim())return;if(ui.adding===f.dataset.key){ui.adding=null;lastAddClose={key:f.dataset.key,t:Date.now()}}f.remove()},150)});
D.addEventListener('keydown',e=>{if(e.key==='Escape'&&e.target.matches?.('form.add[data-key] input')){e.target.value='';e.target.blur()}});
D.addEventListener('submit',e=>{const f=e.target.closest('form[data-f]');if(!f)return;e.preventDefault();FORMS[f.dataset.f]?.(f)});
D.addEventListener('input',e=>{const t=e.target;
if(t.dataset.in==='note'){grow(t);const d=dayEnsure(ui.sel);d.n=t.value;dayDone(ui.sel);const w=t.value.trim()?t.value.trim().split(/\s+/).length:0;const wc=$('#wc');if(wc)wc.textContent=plural(w,'word')}
else if(t.dataset.in==='lq'){ui.lq=t.value;renderItems()}});
D.addEventListener('change',e=>{const t=e.target;const k=t.dataset.ch||t.dataset.in;
if(k==='note')renderCal();
else if(k==='num'){const tr=trk(t.dataset.t);if(!tr)return;const v=t.value===''?null:Number(t.value);setScore(tr.id,v==null||isNaN(v)?null:v);renderCal()}
else if(k==='lsort'){ui.lsort=t.value;renderItems()}
else if(k==='rmtime'){if(t.value){setRemind({time:t.value});if(remindState().on)toast(`Reminder moved to ${t.value}`)}}
else if(k==='rmon'){if(!t.checked){setRemind({on:false});toast('Reminder off');return}
const done=ok=>{const c=$('#rm-on');if(ok){setRemind({on:true});toast(`Reminder set for ${remindState().time}`)}else{if(c)c.checked=false;toast('Allow notifications for Planner in Android settings to get reminders.')}};
if(APP.notificationsAllowed())done(true);else{window.__notifyPerm=done;APP.requestNotifications()}}
else if(k==='bkfile'){const f=t.files?.[0];if(!f)return;f.text().then(tx=>{let o;try{o=JSON.parse(tx)}catch(err){toast('That file isn’t a planner backup');return}
$('#bk-out').innerHTML=`<p class="meta">Backup from the file has ${Object.keys(o.months||{}).length} months of days and ${Object.keys(o.lists||{}).length} lists.</p><button class="btn danger" id="bk-go">Replace everything with this backup</button>`;
const go=$('#bk-go');go.addEventListener('click',()=>{if(armed(go))restore(o)})})}});
D.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#ov').classList.contains('open'))closeSheet();else if($('#wov').classList.contains('open'))closeWrapped()}
if($('#wov').classList.contains('open')&&(e.key==='ArrowRight'||e.key==='ArrowLeft')&&!e.target.matches('input,textarea,select')){scrollDeck(e.key==='ArrowRight'?1:-1);e.preventDefault()}});
/* tooltip */
const tip=$('#tip');
D.addEventListener('pointerover',e=>{const el=e.target.closest('[data-tip]');if(!el){tip.classList.remove('on');return}tip.textContent=el.dataset.tip;tip.classList.add('on');const r=el.getBoundingClientRect();const w=tip.offsetWidth;let x=r.left+r.width/2-w/2;x=Math.max(8,Math.min(innerWidth-w-8,x));let y=r.top-tip.offsetHeight-8;if(y<8)y=r.bottom+8;tip.style.left=x+'px';tip.style.top=y+'px'});
D.addEventListener('scroll',()=>tip.classList.remove('on'),true);
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600)}
const TABS=['calendar','todo','habits','lists','stats','goals'];
function fromHash(){let h=location.hash.slice(1);if(h==='wrapped')h='stats';if(TABS.includes(h)&&h!==ui.tab){ui.tab=h;if(S)render();else{$$('#tabs button').forEach(b=>b.toggleAttribute('aria-current',b.dataset.t===h))}}}
addEventListener('hashchange',fromHash);
matchMedia('(min-width:760px)').addEventListener('change',()=>{if(S&&ui.tab==='habits')render()});
fromHash();
function checkDay(){const t=TODAY();if(S&&t!==checkDay.last){const was=checkDay.last;checkDay.last=t;if(was&&ui.sel===was){ui.sel=t;ui.month=t.slice(0,7)}if(was){render();widgetSync();if(mode==='local')rolloverCheck()}}}
checkDay.last=TODAY();
setInterval(checkDay,60000);
D.addEventListener('visibilitychange',()=>{if(D.hidden)window.__pause();else window.__resume()});
addEventListener('pagehide',()=>window.__pause());
addEventListener('online',()=>{if(mode==='github')syncNow()});
setInterval(()=>{if(!D.hidden&&mode==='github'&&!pushing&&!pulling)syncNow()},180000);
boot();
}
</script>
