name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Put the planner page inside the app
        run: |
          sed -i "s/__APP_VERSION__/${{ github.run_number }}/g" www/index.html
          mkdir -p android/app/src/main/assets/www
          cp www/index.html android/app/src/main/assets/www/index.html

      - name: Build the APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::The KEYSTORE_PASSWORD secret is missing. Add it under Settings > Secrets and variables > Actions." | tee build.log
            exit 1
          fi
          cd android
          set -o pipefail
          gradle assembleRelease --no-daemon --console=plain --warning-mode=none 2>&1 | tee ../build.log
          cp app/build/outputs/apk/release/app-release.apk ../life-planner.apk

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ github.run_number }}
          name: Version ${{ github.run_number }}
          body: ${{ github.event.head_commit.message || 'Manual build' }}
          files: life-planner.apk
          make_latest: true

      - name: Save the build log to the ci-log branch
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/ci-log && cd /tmp/ci-log
          git init -q -b ci-log
          tail -c 200000 "$GITHUB_WORKSPACE/build.log" > build.log 2>/dev/null || echo "No log" > build.log
          echo "${{ job.status }} | build ${{ github.run_number }} | ${{ github.sha }}" > status.txt
          git add .
          git -c user.name="build bot" -c user.email="actions@users.noreply.github.com" commit -qm "Build ${{ github.run_number }}: ${{ job.status }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-log

  web-build:
    name: Web version build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sed -i "s/__APP_VERSION__/${{ github.run_number }}/g" www/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: www

  web:
    name: Web version (GitHub Pages)
    needs: web-build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

      - name: Save deploy details to the ci-log-web branch
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/ci-log && cd /tmp/ci-log
          git init -q -b ci-log-web
          api="https://api.github.com/repos/${{ github.repository }}"
          curl -s -H "Authorization: Bearer $GH_TOKEN" "$api/actions/runs/${{ github.run_id }}/artifacts" > artifacts.json
          curl -s -H "Authorization: Bearer $GH_TOKEN" "$api/pages" > pages.json
          echo "${{ job.status }} | deploy ${{ steps.deploy.outcome }} | build ${{ github.run_number }}" > status.txt
          git add .
          git -c user.name="build bot" -c user.email="actions@users.noreply.github.com" commit -qm "Web build ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-log-web
